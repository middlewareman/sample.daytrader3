apply plugin: 'ear'
apply plugin: 'java'
apply plugin: 'eclipse-wtp'

// Use the Liberty Gradle plugin to run our functional tests
apply plugin: 'liberty'

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'io.openliberty.tools:liberty-gradle-plugin:3.10.0'
    }
}
configurations { derbyDriver }

ear {
    manifest {
        attributes 'Implementation-Title': 'DayTrader 3'
    }
    archiveFileName = 'daytrader3-ee6.ear'
}

task copyDerbyLib(type: Copy) {
    into "../daytrader3-ee6-wlpcfg/shared/resources/Daytrader3_SampleDerbyLibs"
    from configurations.derbyDriver
}


// The reusable verification module owns an isolated server and fixture.
task fvt {
    group = 'Verification'
    description = 'Runs the isolated trading characterization suite.'
    dependsOn ':daytrader3-verification:check'
}

repositories { mavenCentral(); }
dependencies {
    // Pin the runtime separately from the Java EE 6 features used by server.xml.
    if (!project.hasProperty('libertyRoot')) {
        libertyRuntime 'com.ibm.websphere.appserver.runtime:wlp-javaee7:24.0.0.9@zip'
    }
    deploy project(path: ':daytrader3-ee6-ejb', configuration: 'archives')
    deploy project(path: ':daytrader3-ee6-web', configuration: 'archives')
    deploy project(path: ':daytrader3-ee6-rest', configuration: 'archives')
    derbyDriver group: 'org.apache.derby', name: 'derby', version: '10.10.1.1'
}
deploy.dependsOn 'ear'
libertyStart.mustRunAfter 'deploy'

liberty {
    installDir = owner.hasProperty('libertyRoot') ? "${libertyRoot}" : null
    // Upstream committed generated server state; keep new logs/state in build/.
    userDir = rootProject.file('daytrader3-ee6-wlpcfg').absolutePath
    server {
        name = 'daytrader3_Sample'
        outputDir = "${buildDir}/liberty-output"
        looseApplication = false
        deploy { apps = [ear] }
    }
}

// The old sample asset installer is unnecessary: the server config and EAR are
// already in this checkout. Install the exact features at the runtime's version.
task installDayTraderFeatures(type: Exec, dependsOn: installLiberty) {
    group = 'Liberty'
    description = 'Installs the Java EE 6 features required by DayTrader.'
    onlyIf {
        def runtimeDir = liberty.installDir ?: "${buildDir}/wlp"
        !['ejbLite-3.1', 'jsf-2.0', 'jaxrs-1.1', 'jpa-2.0',
          'jmsMdb-3.1', 'wasJmsServer-1.0', 'wasJmsClient-1.1'].every {
            new File(runtimeDir, "lib/features/com.ibm.websphere.appserver.${it}.mf").exists()
        }
    }
    doFirst {
        def runtimeDir = liberty.installDir ?: "${buildDir}/wlp"
        def suffix = System.getProperty('os.name').toLowerCase().contains('windows') ? '.bat' : ''
        executable = new File(runtimeDir, "bin/featureUtility${suffix}").absolutePath
        environment 'JAVA_HOME', javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }.get().metadata.installationPath.asFile.absolutePath
    }
    args 'installFeature', 'ejbLite-3.1', 'jsf-2.0', 'jaxrs-1.1', 'jpa-2.0',
         'jmsMdb-3.1', 'wasJmsServer-1.0', 'wasJmsClient-1.1'
}

libertyStart.dependsOn installDayTraderFeatures, copyDerbyLib, deploy

// Normal builds package the EAR; deployment is explicit through libertyStart.

// Run FVT by default
check.dependsOn 'fvt'
// do not create server since the usr directory is prebuilt.\
libertyCreate.enabled = false
